[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tmuxp-worktree"
version = "0.1.0"
description = "tmuxp plugin: pick the git worktree a session starts in"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["tmuxp>=1.73"]
keywords = ["tmux", "tmuxp", "git", "worktree", "plugin"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["tmuxp_worktree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
